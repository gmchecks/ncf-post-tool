<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Not Common Facts — Post Generator</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Anton&family=Archivo+Black&family=Archivo:wght@700;800;900&family=Roboto:wght@700;900&family=Oswald:wght@600;700&family=Inter:wght@600;700;800&family=Bebas+Neue&family=League+Gothic&family=Antonio:wght@700&family=Big+Shoulders+Display:wght@800;900&family=Barlow+Condensed:wght@800;900&family=Saira+Extra+Condensed:wght@800;900&display=swap');

/* ===========================================================================
   HEADLINE FACE — Archivo Black

   No font file to manage and nothing to paste. Earlier versions of this file
   declared a face called "Druk Condensed Super" with a placeholder src, and
   every render quietly fell through to Archivo Black, third in the stack.
   That fallback is the look on every post so far - so it is now the actual
   choice rather than an accident.
   =========================================================================== */

:root {
  /* Every dimension in this file is expressed in em, and 1em is derived from
     the canvas width. That is what makes the whole design resolution
     independent: render at 1080 for a proof, 2160 for the real post, and the
     layout is identical, just with twice the pixels in the type and photos. */
  --w: 1080px;

  --gold-1: #FFF6D0;
  --gold-2: #F7D774;
  --gold-3: #E0A93B;
  --gold-4: #B97A1E;
  --rule:   var(--hgold);
  --hgold:  #FFDB3D;   /* brighter lemon-gold: the old #ECCF49 read as mustard on phones; &gold=RRGGBB overrides */
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  background: #101010;
  display: flex;
  align-items: flex-start;
  justify-content: center;
}

#canvas {
  position: relative;
  width: var(--w);
  height: calc(var(--w) * var(--ar, 1.3333));   /* 3:4 - 1080x1440 at scale 1 (Instagram's tallest feed post); &ar=45 gives the old 4:5 */
  font-size: calc(var(--w) / 27);  /* the em basis */
  overflow: hidden;
  background: #000;
  font-family: 'Inter', system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
}

/* ---------- background ---------------------------------------------------- */

#bg {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  object-fit: cover;
  object-position: 50% 22%;   /* lower crop: keeps the subject off the top edge */

  /* The finishing grade. A raw photo dropped straight onto a canvas always
     reads as a photo with text on it; a graded one reads as a designed post.
     Contrast and saturation lifted, a touch darker so gold type separates,
     and sharpened AFTER it has been scaled into the frame - which is the
     point where softness actually shows up. */
  filter: url(#sharp) contrast(1.13) saturate(1.18) brightness(0.96);
}

/* A cool dark wash over the whole frame, so gold type always has something to
   sit against even when the photo underneath is bright and busy. */
/* The dark band behind the headline. Its stops are set in JS from the
   measured top of the capitals, not from fixed percentages: a fixed fade
   starts in the same place whatever the headline does, so a short headline
   left the photo darkened far above the text. */
#tone {
  position: absolute; inset: 0;
  background:
    radial-gradient(120% 80% at 50% 18%, rgba(0,0,0,0) 38%, rgba(0,0,0,.42) 100%),
    linear-gradient(to bottom,
      rgba(0,0,0,.30) 0%,
      rgba(0,0,0,.10) 26%,
      rgba(0,0,0,.00) 42%,
      rgba(0,0,0,.55) 58%,
      rgba(0,0,0,.88) 72%,
      rgba(0,0,0,.97) 84%,
      #000 100%);
}

/* ---------- badges (the circle with the pop-out) -------------------------- */

.badge { position: absolute; }

.badge .disc {
  position: absolute; inset: 0;
  border-radius: 50%;
  overflow: hidden;
  /* A plain fill, not a photograph. When there is a cut-out, the circle is
     simply a window the subject stands in - so anything else in there is a
     second, competing image sitting behind the first. Photos only go in the
     disc when there is NO cut-out to show (the .flat case below). */
  background:
    radial-gradient(120% 110% at 50% 18%, #575f6d 0%, #2b3039 52%, #14161b 100%);
}
.badge.flat .disc img {
  width: 100%; height: 100%;
  object-fit: cover;
  object-position: 50% 28%;
  /* Only reached when background removal produced nothing. A framed portrait
     is a reasonable fallback; a portrait with a second copy of itself pasted
     on top is not. */
  filter: saturate(1.08) contrast(1.05);
}

/* The ring sits ABOVE the disc but BELOW the cut-out, which is the whole
   trick: the subject's head crosses in front of the ring and the badge stops
   looking like a sticker. */
.badge .ring {
  position: absolute; inset: 0;
  border-radius: 50%;
  border: .045em solid var(--hgold);
  box-shadow: 0 0 .30em rgba(0,0,0,.55);
  z-index: 2;
}

/* Inside the circle: the FULL photograph, background and all. Above the
   circle: the same photograph with its background removed. Both are drawn in
   the SAME box at the SAME scale, so the subject runs continuously from one
   into the other.

   Both use cover, not contain. Contained, the photo sat inside the circle
   with its straight bottom edge showing and dark gradient beneath it - the
   square visible at the bottom of every badge. Cover fills the circle edge to
   edge, and because the cut-out has identical pixel dimensions to the photo
   it was made from, it crops identically and stays in register. */
.badge .disc img,
.badge .cut {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  object-fit: cover;
  object-position: 50% 0%;
}

/* The clip layer is TWICE the badge's height and hangs above it, because the
   pop-out rises past the top of the badge - a layer the size of the badge
   masks that part away, which sheared the subject's head off.

   Its mask is the union of the circle (the bottom half of this taller box)
   and everything above the circle's centre. Because the box is twice as tall
   as it is wide, "closest-side" resolves to exactly the circle's radius. */
.badge .cutclip {
  position: absolute;
  left: 0; right: 0; bottom: 0; top: -100%;
  z-index: 3;
  filter: drop-shadow(0 .05em .12em rgba(0,0,0,.65));
  /* circle  UNION  (everything above the centre, faded softly at the far left
     and right). The fade (Nov 2026): hair or shoulders that rise past the
     circle's sides used to hit the edge of this box and stop on a hard
     vertical line - a 'box line' beside the pop-out. */
  -webkit-mask-image: radial-gradient(circle closest-side at 50% 75%, #000 calc(100% - .05em), transparent calc(100% - .04em)),
                      linear-gradient(to bottom, #000 0 75%, transparent 75%),
                      linear-gradient(to right, transparent 0%, #000 9%, #000 91%, transparent 100%);
  mask-image: radial-gradient(circle closest-side at 50% 75%, #000 calc(100% - .05em), transparent calc(100% - .04em)),
              linear-gradient(to bottom, #000 0 75%, transparent 75%),
              linear-gradient(to right, transparent 0%, #000 9%, #000 91%, transparent 100%);
  -webkit-mask-composite: source-over, source-in;
  mask-composite: add, intersect;
}

/* No pop-out (subject cut off at the top of its image): keep the whole
   cut-out inside the circle. */
.badge[data-fit="object"] .cutclip {
  /* objects (a flag, a car): the popped-out part stays fully solid right to
     its edge - the soft side fade let the gold ring show through a flag */
  -webkit-mask-image: radial-gradient(circle closest-side at 50% 75%, #000 calc(100% - .05em), transparent calc(100% - .04em)),
                      linear-gradient(to bottom, #000 0 75%, transparent 75%);
  mask-image: radial-gradient(circle closest-side at 50% 75%, #000 calc(100% - .05em), transparent calc(100% - .04em)),
              linear-gradient(to bottom, #000 0 75%, transparent 75%);
  -webkit-mask-composite: source-over;
  mask-composite: add;
}
.badge.nopop .cutclip {
  -webkit-mask-image: radial-gradient(circle closest-side at 50% 75%, #000 calc(100% - .05em), transparent calc(100% - .04em));
  mask-image: radial-gradient(circle closest-side at 50% 75%, #000 calc(100% - .05em), transparent calc(100% - .04em));
}
.badge .cut {
  z-index: 3;
  /* No drop-shadow here, deliberately. A drop-shadow traces the image's alpha
     channel, so it only outlines the subject when background removal was
     perfect. Where any background survives - or across the feathered side
     edges below - it traces a soft RECTANGLE instead, and a square shadow
     behind a pop-out destroys the very effect it was meant to sell. The ring
     already separates the subject from the photo.

     Sharpening is off for the same reason: a convolution across a
     transparent edge rings, leaving a faint halo exactly where the cut-out
     should melt into the background. */
  filter: contrast(1.06) saturate(1.10);

  /* Side feather only. Background removal is not always clean, and a source
     photo with no separable background leaves hard vertical seams; feathering
     the outer edges hides them. The clip layer handles the lower edge. */
  -webkit-mask-image: linear-gradient(to right, transparent 0%, #000 9%, #000 91%, transparent 100%);
  mask-image: linear-gradient(to right, transparent 0%, #000 9%, #000 91%, transparent 100%);
  pointer-events: none;
}


/* The glue. Elements sourced from three different places - a generated
   background, a stock cut-out, a logo PNG - never share a light source. One
   soft-light wash across all of them imposes one, which is most of what makes
   a composite read as a single photograph instead of a collage. It sits above
   the imagery and below the rule and headline, so the gold stays clean. */
#glue {
  position: absolute; inset: 0;
  z-index: 4;
  pointer-events: none;
  mix-blend-mode: soft-light;
  opacity: .55;
  background: linear-gradient(180deg,
    rgba(255,231,178,.42) 0%,
    rgba(255,255,255,.06) 42%,
    rgba(0,18,56,.40) 100%);
}

/* Without a real cut-out there is nothing to break the circle, so the badge
   renders as a plain framed portrait rather than a broken-looking disc. */
.badge.flat .ring { border-color: var(--hgold); }

/* Foil rings, matching the headline gold. A border can't take a gradient
   and stay round, so the ring's own border goes transparent (its shadow
   stays) and a masked layer paints the gradient in exactly that band: pale
   shine at the top, rich gold, deeper amber at the bottom. */
.gs-foil .badge .ring { border-color: transparent; }
.gs-foil .badge .ring::before {
  content: ''; position: absolute; inset: -.075em; border-radius: 50%;
  padding: .075em;
  background: linear-gradient(180deg, #FFF9CC 0%, #FFE82E 28%, #FFF4A8 45%, #FFE31F 58%, #FFDE17 82%, #F7D200 100%);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
  mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
}
.ringc-white.gs-foil .badge .ring { border-color: rgba(255,255,255,.92); }
.ringc-white.gs-foil .badge .ring::before { display: none; }

/* &ringc=white - the thin silver ring the reference accounts use, leaving
   gold to the arrow and the headline. Default stays gold. */
.ringc-white .badge .ring,
.ringc-white .badge.flat .ring { border-color: rgba(255,255,255,.92); }

/* ---------- layout templates (&layout=) ------------------------------------
   Only the top half changes between templates; the rule, logo and headline
   are identical on every post, the way the reference account does it.
   classic - small badge, top corner (the original)
   scene   - no badge, the image carries the post
   big     - a large badge that bleeds off the side of the frame
   arrow   - big badge plus a gold arrow pointing into the scene
   zoom    - big flat circle showing a close-up photo, arrow into the scene */
.badge.big .ring { box-shadow: 0 0 .5em rgba(0,0,0,.6); }
.badge.zoom .disc img { object-position: 50% 45%; }

/* ---------- logo layer ---------------------------------------------------- */

#logo {
  position: absolute;
  z-index: 4;
  filter: drop-shadow(0 .10em .30em rgba(0,0,0,.6));
}
#logo img { width: 100%; height: auto; display: block; }

/* ---------- arrows -------------------------------------------------------- */

#arrows { position: absolute; inset: 0; z-index: 3; pointer-events: none; }

/* ---------- rule + wordmark ---------------------------------------------- */

/* Glow ring (carousel cover badges): a thin, crisp white rim with a soft
   light bleeding outward - the look of the reference covers - in place of
   the gold foil ring. */
.badge.glowring .ring { border-color: rgba(255,255,255,.96) !important; border-width: .035em !important;
  box-shadow: 0 0 .35em rgba(255,255,255,.85), 0 0 1.2em rgba(255,244,214,.55), 0 .15em .6em rgba(0,0,0,.35) !important; }
.badge.glowring .ring::before { display: none !important; }
/* &mbring=thin: a thin, clean light ring with no glow (the reference covers). */
.badge.thinring .ring { border-color: rgba(235,235,235,.95) !important; border-width: .022em !important;
  box-shadow: 0 .08em .35em rgba(0,0,0,.35) !important; }
/* &mbspill: the cut-out subject may spill past the SIDES of its ring as well
   as the top - everything above the lower part of the circle is unmasked. */
.badge.spill .cutclip {
  -webkit-mask-image: radial-gradient(circle closest-side at 50% 75%, #000 calc(100% - .05em), transparent calc(100% - .04em)),
                      linear-gradient(to bottom, #000 0 84%, transparent 84%);
  mask-image: radial-gradient(circle closest-side at 50% 75%, #000 calc(100% - .05em), transparent calc(100% - .04em)),
              linear-gradient(to bottom, #000 0 84%, transparent 84%);
}
/* Multi-badge carousel covers (&mb=url|url|url): round previews of the
   slides inside, in the same foil ring as the other badges, so the cover
   shows there is plenty to swipe through. */
.mbadge {
  position: absolute; z-index: 3; border-radius: 50%;
  box-shadow: 0 .12em .45em rgba(0,0,0,.55);
}
.mbadge .mimg {
  position: absolute; inset: 0; border-radius: 50%; overflow: hidden; background: #222;
}
.mbadge .mimg img { width: 100%; height: 100%; object-fit: cover; display: block; }

.mbadge .mring {
  position: absolute; inset: -.07em; border-radius: 50%; padding: .07em;
  background: linear-gradient(180deg, #FFF9CC 0%, #FFE82E 28%, #FFF4A8 45%, #FFE31F 58%, #FFDE17 82%, #F7D200 100%);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
  mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
}
/* Carousel item slides: the caption under the gold item name, and the
   slide counter in the top corner. */
#sub {
  display: none;
  position: absolute; left: 50%; transform: translateX(-50%);
  bottom: 3.2%; width: 86%; z-index: 5;
  font-family: 'Inter', 'Archivo', sans-serif; font-weight: 700;
  font-size: .98em; line-height: 1.22; text-align: center; color: #fff;
  text-shadow: 0 .06em .25em rgba(0,0,0,.6);
}
/* Quote posts: "- NAME" under the quote. */
#sub.attrib { font-size: .78em; letter-spacing: .04em; color: #fff; }
#counter {
  display: none;
  position: absolute; top: 3.2%; right: 3.6%; z-index: 6;
  font-family: 'Inter', sans-serif; font-weight: 800; font-size: .72em; letter-spacing: .04em;
  color: #fff; background: rgba(0,0,0,.45); border: .06em solid rgba(255,255,255,.35);
  padding: .28em .7em; border-radius: 2em;
}
#rule {
  position: absolute;
  left: 3.6%;
  right: 3.6%;
  z-index: 5;
  display: flex;
  align-items: center;
  gap: .22em;              /* lines sit close to the logo */
}
#rule .line { flex: 1; height: .045em; background: var(--rule); opacity: .95; }
/* Foil lines, matching the headline gold: deeper amber at the outer ends,
   brightening toward the logo with a pale shine band. The right-hand line is
   the mirror image. Slightly thicker so the gradient actually reads. */
#rule.gs-foil .line {
  height: .07em; opacity: 1; border-radius: .035em;
  background: linear-gradient(90deg, #F7D200 0%, #FFDE17 18%, #FFE31F 45%, #FFF4A8 72%, #FFE82E 86%, #FFE31F 100%);
}
#rule.gs-foil .line:last-child {
  background: linear-gradient(270deg, #F7D200 0%, #FFDE17 18%, #FFE31F 45%, #FFF4A8 72%, #FFE82E 86%, #FFE31F 100%);
}
/* White lines (&rulecolor=white): crisp white, fading slightly toward the
   outer ends, instead of the foil gold. */
#rule.rule-white .line, #rule.rule-white.gs-foil .line {
  height: .06em; opacity: 1; border-radius: .03em;
  background: linear-gradient(90deg, rgba(255,255,255,.55) 0%, #fff 55%, #fff 100%);
}
#rule.rule-white .line:last-child, #rule.rule-white.gs-foil .line:last-child {
  background: linear-gradient(270deg, rgba(255,255,255,.55) 0%, #fff 55%, #fff 100%);
}
#rule .brand { height: 1.15em; width: auto; display: block;
  /* A very soft gold glow around the logo, in the headline gold. */
  filter: drop-shadow(0 0 .18em rgba(255, 210, 26, .55)); }

/* ---------- headline ------------------------------------------------------ */

#headline {
  /* Slightly heavier letters (Oct 2026): a thin outline in each letter's own
     colour thickens League Gothic so the headline reads denser and fills its
     space without stretching the letters tall. &hstroke=0 turns it off. */
  -webkit-text-stroke: var(--hstroke, 0.006em) currentColor; paint-order: stroke fill;
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  width: 92.8%;              /* JS narrows this to balance the line lengths */
  z-index: 5;
  font-family: 'Archivo Black', 'Anton', sans-serif;
  text-transform: uppercase;
  text-align: center;
  /* Tight enough to read as a solid stacked block, loose enough that the
     caps of one line never touch the next. The balancer reads the COMPUTED
     line height, so changing this number is safe. */
  line-height: .88;
  letter-spacing: -.004em;
  font-size: 2.4em;              /* starting size; JS fits it from here down */

  /* The caps are taller than the line box they sit in, so the top of
     the first line pokes above the element's own box. Since the gold is a
     background clipped to the glyph shapes, anything outside that box has no
     background to show and simply vanishes - which reads as the headline
     being sliced off along the top. This padding grows the box past the
     glyphs so the whole letter gets painted. */
  padding: .17em 0 .07em;

  /* One flat colour, top to bottom - sampled from the @wealth reference
     posts, where the headline gold clusters tightly around #ECCF49 across all
     five screenshots. No gradient and no texture: the reference reads as a
     solid, confident yellow-gold, and a gradient pulls it toward amber. */
  color: var(--hgold);
  -webkit-text-fill-color: var(--hgold);
  filter: drop-shadow(0 .035em .05em rgba(0,0,0,.85));
}

/* A faint grain laid over the letters only. Real foil has tooth; a perfectly
   smooth gradient is the thing that makes a gold headline look synthetic. */
#grain {
  display: none;             /* flat colour means no texture */
  position: absolute;
  z-index: 6;
  pointer-events: none;
  mix-blend-mode: overlay;
  opacity: .30;
}


/* ---- headline colour schemes (&hc=) ------------------------------------
   flat  one sampled gold top to bottom - the default
   grad  the earlier look: pale cream at the top into deep gold at the base
   top   first line white, everything after it gold
   alt   lines alternate white and gold
   Kept as options so a scheme can be previewed without touching live posts. */
#headline.hc-grad {
  background-image: linear-gradient(177deg, #FFF6D0 0%, #F7D774 22%, #FFF6D0 38%,
                                    #E0A93B 62%, #B97A1E 88%, #E0A93B 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  -webkit-text-fill-color: transparent;
}
#headline.hc-top .hl-line   { color: var(--hgold); -webkit-text-fill-color: var(--hgold); }
#headline.hc-top .hl-line-1 { color: #FFFFFF; -webkit-text-fill-color: #FFFFFF; }
#headline.hc-alt .hl-odd    { color: #FFFFFF; -webkit-text-fill-color: #FFFFFF; }
#headline.hc-alt .hl-even   { color: var(--hgold); -webkit-text-fill-color: var(--hgold); }
#headline.hc-mix .hw-white { color: #FFFFFF; -webkit-text-fill-color: #FFFFFF; }
#headline.hc-mix .hw-gold  { color: var(--hgold); -webkit-text-fill-color: var(--hgold); }

/* ---- gold word styles (&gs=) ---------------------------------------------
   flat    one solid gold (the old look)
   bright  a lighter, punchier gold
   grad    bright metallic gradient: pale gold highlight at the top, rich
           gold through the middle, a deeper amber at the foot of the letters
   foil    the gradient plus a thin shine band, like printed foil */
#headline.gs-bright .hw-gold { color: #FFE234; -webkit-text-fill-color: #FFE234; }
#headline.gs-grad .hw-gold, #headline.gs-foil .hw-gold {
  background: linear-gradient(180deg, #FFF6B8 0%, #FFE82E 34%, #FFE31F 62%, #FFDE17 100%);
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent; color: transparent;
}
#headline.gs-foil .hw-gold {
  /* Bright, even yellow (no dark foot, so phones don't turn it mustard) with
     a fine printed grain, like the gold on the reference headlines. */

<!-- Sharpening kernels. A convolve matrix works on the composited element, so
     the background, the cut-outs and the logo can each be sharpened after
     they have been scaled into place - which is where softness actually
     creeps in. preserveAlpha keeps cut-out transparency intact. -->
<svg id="fx" width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="sharp" x="-2%" y="-2%" width="104%" height="104%">
    <feConvolveMatrix order="3" preserveAlpha="true" divisor="1"
      kernelMatrix="0 -0.35 0  -0.35 2.4 -0.35  0 -0.35 0"/>
  </filter>
  <filter id="sharpHD" x="-2%" y="-2%" width="104%" height="104%" color-interpolation-filters="sRGB">
    <feConvolveMatrix order="3" preserveAlpha="true" divisor="1"
      kernelMatrix="0 -0.6 0  -0.6 3.4 -0.6  0 -0.6 0"/>
  </filter>
  <filter id="sharpSoft" x="-2%" y="-2%" width="104%" height="104%">
    <feConvolveMatrix order="3" preserveAlpha="true" divisor="1"
      kernelMatrix="0 -0.2 0  -0.2 1.8 -0.2  0 -0.2 0"/>
  </filter>
</svg>

<div id="canvas">
  <img id="bg" alt="">
  <div id="tone"></div>
  <svg id="arrows" viewBox="0 0 1080 1350" preserveAspectRatio="none"></svg>
  <div id="badges"></div>

  <div id="glue"></div>
  <div id="sub"></div>
  <div id="counter"></div>
  <div id="rule"><span class="line"></span><img class="brand" alt=""><span class="line"></span></div>
  <h1 id="headline"></h1>
  <svg id="grain"><filter id="gf"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3"/></filter><rect width="100%" height="100%" filter="url(#gf)"/></svg>
</div>

<script>
/* PHOTO FIX MODE (&fix=<image url>): used by the pipeline, not a post.
   Draws one photo on a plain 3:4 frame (1080x1440) and nothing else.
   &half=left|right keeps only that half of a side-by-side photo.
   &fit=contain (default) fits the whole photo on a flat grey background,
   so the AI can paint the grey bands in ("expand"); &fit=cover crops it to
   fill the frame instead. &fixy=0-1 sets the photo's height in the frame. */
(function () {
  var Q = new URLSearchParams(location.search);
  var src = Q.get('fix');
  if (!src) return;
  window.__NCF_FIX = true;
  var W = 1080, H = 1440;
  var half = Q.get('half') || '';
  var mode = Q.get('fit') === 'cover' ? 'cover' : 'contain';
  function done() { var r = document.createElement('div'); r.id = 'render-ready'; document.body.appendChild(r); }
  document.addEventListener('DOMContentLoaded', function () {
    document.body.innerHTML = '';
    document.body.style.cssText = 'margin:0;background:#808080;transform:none;';
    var box = document.createElement('div');
    box.id = 'canvas';
    box.style.cssText = 'position:relative;width:' + W + 'px;height:' + H + 'px;overflow:hidden;background:#808080;';
    document.body.appendChild(box);
    var img = new Image();
    img.onload = function () {
      var nw = img.naturalWidth, nh = img.naturalHeight, sw = nw, sx = 0;
      if (half === 'left' || half === 'right') { sw = nw / 2; if (half === 'right') sx = sw; }
      var s = mode === 'cover' ? Math.max(W / sw, H / nh) : Math.min(W / sw, H / nh);
      // &fixz (0.4-1): ZOOM-OUT PREP. The photo is drawn at this share of the
      // frame's width, high up, with room on every side - for a tight portrait
      // (a mugshot). The margins get a soft hint of the photo's own wall (see
      // fill=edge) and the AI then paints them in as real, sharp wall and
      // clothes - the person is never re-drawn, so they cannot be copied.
      var FZ = parseFloat(Q.get('fixz'));
      if (FZ > 0.4 && FZ < 1) { s = (W * FZ) / sw; mode = 'contain'; }
      var dw = sw * s, dh = nh * s;
      var win = document.createElement('div');
      // &fixy (0-1): where the photo sits vertically when it is shorter than
      // the frame. 0.5 centres it; the pipeline uses ~0.1 for expanded post
      // photos so the people sit high, above where the headline will go, and
      // the AI fills the space underneath.
      var fy = parseFloat(Q.get('fixy')); if (isNaN(fy)) fy = 0.5; fy = Math.max(0, Math.min(1, fy));
      var wy = (H - dh) * fy;
      // Zoom-out prep: a little headroom above the person; the rest of the
      // spare height goes below (the headline covers the bottom).
      if (FZ > 0.4 && FZ < 1) wy = Math.max(0, Math.min(H - dh, H * 0.07));
      win.style.cssText = 'position:absolute;overflow:hidden;left:' + ((W - dw) / 2) + 'px;top:' + wy + 'px;width:' + dw + 'px;height:' + dh + 'px;';
      img.style.cssText = 'position:absolute;top:0;left:' + (-sx * s) + 'px;width:' + (nw * s) + 'px;height:' + (nh * s) + 'px;max-width:none;';
      win.appendChild(img);
      // &fill=edge: instead of flat grey, the empty bands above and below
      // are filled with the photo's own top and bottom edges, mirrored,
      // stretched and blurred - a hint of more sky above and more ground
      // below, with no people or objects in it to copy. The AI then only has
      // to sharpen that hint into scenery.
      if (Q.get('fill') === 'edge' && mode === 'contain') {
        var top = wy, bot = H - top - dh, lx = (W - dw) / 2;
        var cv = document.createElement('canvas'); cv.width = W; cv.height = H;
        cv.style.cssText = 'position:absolute;left:0;top:0;width:' + W + 'px;height:' + H + 'px;';
        var cx = cv.getContext('2d');
        cx.filter = 'blur(' + (Q.get('fillblur') || 18) + 'px)';
        var strip = 0.12;   // share of the photo height used as the edge
        if (top > 2) {
          cx.save(); cx.translate(0, top); cx.scale(1, -1);
          cx.drawImage(img, sx, 0, sw, nh * strip, (W - dw) / 2 - 40, 0, dw + 80, top + 40);
          cx.restore();
        }
        if (bot > 2) {
          cx.save(); cx.translate(0, top + dh); cx.scale(1, -1); cx.translate(0, -bot);
          cx.drawImage(img, sx, nh * (1 - strip), sw, nh * strip, (W - dw) / 2 - 40, -40, dw + 80, bot + 40);
          cx.restore();
        }
        if (FZ > 0.4 && FZ < 1) {
          // Zoom-out prep: redraw the margins. Sides: the photo's outer
          // columns stretched out. Top: only the wall in the two top corners
          // (hair often touches the top edge). Bottom: the clothes at its two bottom corners.
          cx.clearRect(0, 0, W, H);
          cx.filter = 'blur(' + (Q.get('fillblur') || 18) + 'px)';
          var cw = Math.max(2, sw * 0.04), ph = nh * 0.04;
          cx.drawImage(img, sx, 0, cw, nh, -40, top, lx + 42, dh);
          cx.drawImage(img, sx + sw - cw, 0, cw, nh, lx + dw - 2, top, W - (lx + dw) + 42, dh);
          if (top > 2) {
            cx.drawImage(img, sx, 0, sw * 0.08, ph, -40, -40, W / 2 + 40, top + 50);
            cx.drawImage(img, sx + sw * 0.92, 0, sw * 0.08, ph, W / 2, -40, W / 2 + 40, top + 50);
          }
          if (bot > 2) {
            // Bottom: the clothes at the photo's two bottom corners (the middle
            // is often the neck), each stretched across its half.
            cx.drawImage(img, sx, nh * 0.95, sw * 0.12, nh * 0.05, -40, top + dh - 10, W / 2 + 40, bot + 50);
            cx.drawImage(img, sx + sw * 0.88, nh * 0.95, sw * 0.12, nh * 0.05, W / 2, top + dh - 10, W / 2 + 40, bot + 50);
          }
        }
        box.insertBefore(cv, box.firstChild);
      }
      box.appendChild(win);
      done();
    };
    img.onerror = done;
    img.src = src;
  });
})();
</script>
<script>
(function () {
  'use strict';
  if (window.__NCF_FIX) return;

  var Q = new URLSearchParams(location.search);
  function p(name, dflt) { var v = Q.get(name); return (v === null || v === '') ? dflt : v; }
  function num(name, dflt) { var v = parseFloat(Q.get(name)); return isNaN(v) ? dflt : v; }
  // Post shape. Instagram's tallest feed post is 3:4 (1080x1440), which also
  // matches the profile grid tile exactly, so it is the default. &ar=45
  // renders the older 4:5 (1080x1350) for any tool that can't take 3:4.
  var AR = (p('ar', '34') === '45') ? 1.25 : 4 / 3;
  var FH = Math.round(1080 * AR);
  document.documentElement.style.setProperty('--ar', AR.toFixed(4));
  (function () { var a = document.getElementById('arrows'); if (a) a.setAttribute('viewBox', '0 0 1080 ' + FH); })();

  /* ---- scale -------------------------------------------------------------
     scale=2 renders 2160x2700. Ask the screenshot service for the matching
     viewport and the post comes back with genuinely twice the detail rather
     than an upscale. */
  var scale = Math.max(1, Math.min(4, num('scale', 1)));
  document.documentElement.style.setProperty('--w', (1080 * scale) + 'px');

  var canvas   = document.getElementById('canvas');
  var bgEl     = document.getElementById('bg');
  var pending = [];   // images we must wait for before declaring ready
  var ruleEl   = document.getElementById('rule');
  var brandEl  = ruleEl.querySelector('.brand');
  var headEl   = document.getElementById('headline');
  var badgesEl = document.getElementById('badges');
  var logoBox  = document.getElementById('logo');
  var arrowsEl = document.getElementById('arrows');
  var grainEl  = document.getElementById('grain');


  function loadImg(el, url) {
    if (!url) return;
    pending.push(new Promise(function (done) {
      // Resolve on error too. A single dead photo should degrade the post,
      // never hang the renderer until the screenshot service times out.
      el.addEventListener('load', done, { once: true });
      el.addEventListener('error', function () { el.style.display = 'none'; done(); }, { once: true });
      el.src = url;
    }));
  }

  /* ---- background --------------------------------------------------------- */
  loadImg(bgEl, p('bg', ''));
  var BGY = num('bgy', 22);
  // AUTO-BRIGHTEN: the page's look is bright - a dark photo drags a post
  // down. Measure the background's average brightness (upper two-thirds,
  // where the picture shows) and lift it when it's dark, up to +35%.
  // &bright=off disables it; if the image can't be measured nothing changes.
  // Off by default - lifting the whole photo flattened it. Grok is asked for
  // brightly lit subjects instead. &bright=on still turns it on.
  if (p('bright', 'off') === 'on') {
    pending.push(new Promise(function (done) {
      var probeBg = new Image();
      probeBg.crossOrigin = 'anonymous';
      probeBg.onload = function () {
        try {
          var cw = 60, chh = Math.round(60 * probeBg.naturalHeight / probeBg.naturalWidth);
          var cv = document.createElement('canvas'); cv.width = cw; cv.height = chh;
          var cx = cv.getContext('2d'); cx.drawImage(probeBg, 0, 0, cw, chh);
          var d = cx.getImageData(0, 0, cw, Math.round(chh * 0.66)).data, sum = 0, cnt = 0;
          for (var k = 0; k < d.length; k += 4) { sum += 0.2126 * d[k] + 0.7152 * d[k + 1] + 0.0722 * d[k + 2]; cnt++; }
          var mean = cnt ? sum / cnt / 255 : 0.5;

            var lift = Math.min(1.35, 0.5 / Math.max(0.2, mean));
            var sat = Math.min(1.12, 1 + (lift - 1) * 0.4);

          }

      setTimeout(done, 12000);
      probeBg.src = p('bg', '');
    }));
  }

  // a photo that is taller than the post; a photo already the post's shape
  // has nothing to slide, so 70 or 170 did nothing. A value over 100 now lifts
  // the whole picture by (value - 100)% of the post height, up to 40%, so the
  // people sit above the headline; the strip it leaves at the bottom is under
  // the black headline area.
  // BRIGHTEN (Oct 2026, the Brighten field): &glow=1|2|3 lifts the picture -
  // brighter, a little more contrast and colour, and a stronger sharpen so it
  // reads crisp and HD. The same grade goes on the subject cut-out laid in
  // front of a badge, so the two always match.
  var GLOW = Math.max(0, Math.min(3, Math.round(num('glow', 0))));
  var GLOW_FILTER = GLOW ? ('url(#sharpHD) contrast(' + (1.08 + GLOW * 0.02).toFixed(2) + ') saturate(' + (1.15 + GLOW * 0.04).toFixed(2) + ') brightness(' + (1 + GLOW * 0.12).toFixed(2) + ')') : '';

  var BGUP = 0;
  if (BGY > 100) { BGUP = Math.min(40, BGY - 100); BGY = 100; }
  // (Nov 2026) BG Crop BELOW 0 moves the whole picture DOWN by that much
  // (-15 = 15% of the post height), leaving a clean dark space at the top for
  // text or graphics added by hand. The picture's top edge fades softly into it.
  if (BGY < 0) { BGUP = Math.max(-50, BGY); BGY = 0; }
  if (BGUP !== 0) {
    bgEl.style.translate = '0 ' + (-BGUP) + '%';
    document.getElementById('canvas').style.backgroundColor = '#000';
  }
  if (BGUP < 0) { var dm = 'linear-gradient(to bottom, transparent 0%, #000 7%, #000 100%)'; bgEl.style.webkitMaskImage = dm; bgEl.style.maskImage = dm; }
  bgEl.style.objectPosition = '50% ' + BGY + '%';
  // &bgfit=auto|contain: a wide image (a website screenshot) is shown WHOLE
  // instead of cropped to the tall canvas - on a blurred, darkened copy of
  // itself that fills the frame. auto only does this when the image is much
  // wider than the canvas; contain always does.
  var BGFIT = p('bgfit', '');
  if (BGFIT) {
    pending.push(new Promise(function (done) {
      var fin = false;
      function go() {
        if (fin) return; fin = true;
        try {
          var iw = bgEl.naturalWidth, ih = bgEl.naturalHeight;
          // contain only matters for a picture wider than the post: one that was
          // already expanded to the post's shape simply fills it as usual.
          if (iw && ih && ((BGFIT === 'contain' && (iw / ih) > (1080 / FH) * 1.1) || (iw / ih) > (1080 / FH) * 1.25)) {

            // and below it is filled by EXTENDING THE PHOTO'S OWN EDGES: its top
            // rows are stretched upward and its bottom rows downward, at full
            // brightness - no dark blurred band. On a plain or simple backdrop
            // (a wall, a studio, sky) this reads as one continuous photo.

            // page's own <img> may not allow reading them, and when the read
            // failed the post fell back to a deep crop of the photo.

     crunchier backgrounds, and a wash that muddied rather than glued.

     Kept, parameterised, so the two halves can be judged separately instead
     of as one all-or-nothing change:
       grade=sharp  sharpening and colour lift only
       grade=wash   the soft-light wash only
       grade=on     both
       (absent)     raw sources, which is what ships. */

  var useSharp = (GRADE === 'on' || GRADE === 'sharp');
  var useWash  = (GRADE === 'on' || GRADE === 'wash');

  if (!useWash) {
    var g = document.getElementById('glue');
    if (g) g.style.display = 'none';
  }
  if (!useSharp) {
    bgEl.style.filter = GLOW_FILTER || 'none';   // the Brighten grade survives this reset

    css.textContent = '.badge .disc img{filter:none}' +
                      '.badge .cut{filter:none}';
    document.head.appendChild(css);
  }
