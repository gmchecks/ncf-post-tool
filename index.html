<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Not Common Facts — Post Generator</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Anton&family=Archivo+Black&family=Archivo:wght@700;800;900&family=Roboto:wght@700;900&family=Oswald:wght@600;700&family=Inter:wght@600;700;800&family=Bebas+Neue&family=League+Gothic&family=Antonio:wght@700&family=Big+Shoulders+Display:wght@800;900&family=Barlow+Condensed:wght@800;900&family=Saira+Extra+Condensed:wght@800;900&display=swap');

/* ===========================================================================
   HEADLINE FACE — Archivo Black

   No font file to manage and nothing to paste. Earlier versions of this file
   declared a face called "Druk Condensed Super" with a placeholder src, and
   every render quietly fell through to Archivo Black, third in the stack.
   That fallback is the look on every post so far - so it is now the actual
   choice rather than an accident.
   =========================================================================== */

:root {
  /* Every dimension in this file is expressed in em, and 1em is derived from
     the canvas width. That is what makes the whole design resolution
     independent: render at 1080 for a proof, 2160 for the real post, and the
     layout is identical, just with twice the pixels in the type and photos. */
  --w: 1080px;

  --gold-1: #FFF6D0;
  --gold-2: #F7D774;
  --gold-3: #E0A93B;
  --gold-4: #B97A1E;
  --rule:   var(--hgold);
  --hgold:  #FFDB3D;   /* brighter lemon-gold: the old #ECCF49 read as mustard on phones; &gold=RRGGBB overrides */
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  background: #101010;
  display: flex;
  align-items: flex-start;
  justify-content: center;
}

#canvas {
  position: relative;
  width: var(--w);
  height: calc(var(--w) * 1.25);   /* 4:5 — 1080x1350 at scale 1 */
  font-size: calc(var(--w) / 27);  /* the em basis */
  overflow: hidden;
  background: #000;
  font-family: 'Inter', system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
}

/* ---------- background ---------------------------------------------------- */

#bg {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  object-fit: cover;
  object-position: 50% 22%;   /* lower crop: keeps the subject off the top edge */

  /* The finishing grade. A raw photo dropped straight onto a canvas always
     reads as a photo with text on it; a graded one reads as a designed post.
     Contrast and saturation lifted, a touch darker so gold type separates,
     and sharpened AFTER it has been scaled into the frame - which is the
     point where softness actually shows up. */
  filter: url(#sharp) contrast(1.13) saturate(1.18) brightness(0.96);
}

/* A cool dark wash over the whole frame, so gold type always has something to
   sit against even when the photo underneath is bright and busy. */
/* The dark band behind the headline. Its stops are set in JS from the
   measured top of the capitals, not from fixed percentages: a fixed fade
   starts in the same place whatever the headline does, so a short headline
   left the photo darkened far above the text. */
#tone {
  position: absolute; inset: 0;
  background:
    radial-gradient(120% 80% at 50% 18%, rgba(0,0,0,0) 38%, rgba(0,0,0,.42) 100%),
    linear-gradient(to bottom,
      rgba(0,0,0,.30) 0%,
      rgba(0,0,0,.10) 26%,
      rgba(0,0,0,.00) 42%,
      rgba(0,0,0,.55) 58%,
      rgba(0,0,0,.88) 72%,
      rgba(0,0,0,.97) 84%,
      #000 100%);
}

/* ---------- badges (the circle with the pop-out) -------------------------- */

.badge { position: absolute; }

.badge .disc {
  position: absolute; inset: 0;
  border-radius: 50%;
  overflow: hidden;
  /* A plain fill, not a photograph. When there is a cut-out, the circle is
     simply a window the subject stands in - so anything else in there is a
     second, competing image sitting behind the first. Photos only go in the
     disc when there is NO cut-out to show (the .flat case below). */
  background:
    radial-gradient(120% 110% at 50% 18%, #575f6d 0%, #2b3039 52%, #14161b 100%);
}
.badge.flat .disc img {
  width: 100%; height: 100%;
  object-fit: cover;
  object-position: 50% 28%;
  /* Only reached when background removal produced nothing. A framed portrait
     is a reasonable fallback; a portrait with a second copy of itself pasted
     on top is not. */
  filter: saturate(1.08) contrast(1.05);
}

/* The ring sits ABOVE the disc but BELOW the cut-out, which is the whole
   trick: the subject's head crosses in front of the ring and the badge stops
   looking like a sticker. */
.badge .ring {
  position: absolute; inset: 0;
  border-radius: 50%;
  border: .045em solid var(--hgold);
  box-shadow: 0 0 .30em rgba(0,0,0,.55);
  z-index: 2;
}

/* Inside the circle: the FULL photograph, background and all. Above the
   circle: the same photograph with its background removed. Both are drawn in
   the SAME box at the SAME scale, so the subject runs continuously from one
   into the other.

   Both use cover, not contain. Contained, the photo sat inside the circle
   with its straight bottom edge showing and dark gradient beneath it - the
   square visible at the bottom of every badge. Cover fills the circle edge to
   edge, and because the cut-out has identical pixel dimensions to the photo
   it was made from, it crops identically and stays in register. */
.badge .disc img,
.badge .cut {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  object-fit: cover;
  object-position: 50% 0%;
}

/* The clip layer is TWICE the badge's height and hangs above it, because the
   pop-out rises past the top of the badge - a layer the size of the badge
   masks that part away, which sheared the subject's head off.

   Its mask is the union of the circle (the bottom half of this taller box)
   and everything above the circle's centre. Because the box is twice as tall
   as it is wide, "closest-side" resolves to exactly the circle's radius. */
.badge .cutclip {
  position: absolute;
  left: 0; right: 0; bottom: 0; top: -100%;
  z-index: 3;
  filter: drop-shadow(0 .05em .12em rgba(0,0,0,.65));
  -webkit-mask-image: radial-gradient(circle closest-side at 50% 75%, #000 calc(100% - .05em), transparent calc(100% - .04em)),
                      linear-gradient(to bottom, #000 0 75%, transparent 75%);
  mask-image: radial-gradient(circle closest-side at 50% 75%, #000 calc(100% - .05em), transparent calc(100% - .04em)),
              linear-gradient(to bottom, #000 0 75%, transparent 75%);
  -webkit-mask-composite: source-over;   /* union */
  mask-composite: add;
}

.badge .cut {
  z-index: 3;
  /* No drop-shadow here, deliberately. A drop-shadow traces the image's alpha
     channel, so it only outlines the subject when background removal was
     perfect. Where any background survives - or across the feathered side
     edges below - it traces a soft RECTANGLE instead, and a square shadow
     behind a pop-out destroys the very effect it was meant to sell. The ring
     already separates the subject from the photo.

     Sharpening is off for the same reason: a convolution across a
     transparent edge rings, leaving a faint halo exactly where the cut-out
     should melt into the background. */
  filter: contrast(1.06) saturate(1.10);

  /* Side feather only. Background removal is not always clean, and a source
     photo with no separable background leaves hard vertical seams; feathering
     the outer edges hides them. The clip layer handles the lower edge. */
  -webkit-mask-image: linear-gradient(to right, transparent 0%, #000 9%, #000 91%, transparent 100%);
  mask-image: linear-gradient(to right, transparent 0%, #000 9%, #000 91%, transparent 100%);
  pointer-events: none;
}


/* The glue. Elements sourced from three different places - a generated
   background, a stock cut-out, a logo PNG - never share a light source. One
   soft-light wash across all of them imposes one, which is most of what makes
   a composite read as a single photograph instead of a collage. It sits above
   the imagery and below the rule and headline, so the gold stays clean. */
#glue {
  position: absolute; inset: 0;
  z-index: 4;
  pointer-events: none;
  mix-blend-mode: soft-light;
  opacity: .55;
  background: linear-gradient(180deg,
    rgba(255,231,178,.42) 0%,
    rgba(255,255,255,.06) 42%,
    rgba(0,18,56,.40) 100%);
}

/* Without a real cut-out there is nothing to break the circle, so the badge
   renders as a plain framed portrait rather than a broken-looking disc. */
.badge.flat .ring { border-color: var(--hgold); }

/* &ringc=white - the thin silver ring the reference accounts use, leaving
   gold to the arrow and the headline. Default stays gold. */
.ringc-white .badge .ring,
.ringc-white .badge.flat .ring { border-color: rgba(255,255,255,.92); }

/* ---------- layout templates (&layout=) ------------------------------------
   Only the top half changes between templates; the rule, logo and headline
   are identical on every post, the way the reference account does it.
   classic - small badge, top corner (the original)
   scene   - no badge, the image carries the post
   big     - a large badge that bleeds off the side of the frame
   arrow   - big badge plus a gold arrow pointing into the scene
   zoom    - big flat circle showing a close-up photo, arrow into the scene */
.badge.big .ring { box-shadow: 0 0 .5em rgba(0,0,0,.6); }
.badge.zoom .disc img { object-position: 50% 45%; }

/* ---------- logo layer ---------------------------------------------------- */

#logo {
  position: absolute;
  z-index: 4;
  filter: drop-shadow(0 .10em .30em rgba(0,0,0,.6));
}
#logo img { width: 100%; height: auto; display: block; }

/* ---------- arrows -------------------------------------------------------- */

#arrows { position: absolute; inset: 0; z-index: 3; pointer-events: none; }

/* ---------- rule + wordmark ---------------------------------------------- */

#rule {
  position: absolute;
  left: 3.6%;
  right: 3.6%;
  z-index: 5;
  display: flex;
  align-items: center;
  gap: .5em;
}
#rule .line { flex: 1; height: .045em; background: var(--rule); opacity: .95; }
#rule .brand { height: 1.15em; width: auto; display: block; }

/* ---------- headline ------------------------------------------------------ */

#headline {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  width: 92.8%;              /* JS narrows this to balance the line lengths */
  z-index: 5;
  font-family: 'Archivo Black', 'Anton', sans-serif;
  text-transform: uppercase;
  text-align: center;
  /* Tight enough to read as a solid stacked block, loose enough that the
     caps of one line never touch the next. The balancer reads the COMPUTED
     line height, so changing this number is safe. */
  line-height: .88;
  letter-spacing: -.004em;
  font-size: 2.4em;              /* starting size; JS fits it from here down */

  /* The caps are taller than the line box they sit in, so the top of
     the first line pokes above the element's own box. Since the gold is a
     background clipped to the glyph shapes, anything outside that box has no
     background to show and simply vanishes - which reads as the headline
     being sliced off along the top. This padding grows the box past the
     glyphs so the whole letter gets painted. */
  padding: .17em 0 .07em;

  /* One flat colour, top to bottom - sampled from the @wealth reference
     posts, where the headline gold clusters tightly around #ECCF49 across all
     five screenshots. No gradient and no texture: the reference reads as a
     solid, confident yellow-gold, and a gradient pulls it toward amber. */
  color: var(--hgold);
  -webkit-text-fill-color: var(--hgold);
  filter: drop-shadow(0 .035em .05em rgba(0,0,0,.85));
}

/* A faint grain laid over the letters only. Real foil has tooth; a perfectly
   smooth gradient is the thing that makes a gold headline look synthetic. */
#grain {
  display: none;             /* flat colour means no texture */
  position: absolute;
  z-index: 6;
  pointer-events: none;
  mix-blend-mode: overlay;
  opacity: .30;
}


/* ---- headline colour schemes (&hc=) ------------------------------------
   flat  one sampled gold top to bottom - the default
   grad  the earlier look: pale cream at the top into deep gold at the base
   top   first line white, everything after it gold
   alt   lines alternate white and gold
   Kept as options so a scheme can be previewed without touching live posts. */
#headline.hc-grad {
  background-image: linear-gradient(177deg, #FFF6D0 0%, #F7D774 22%, #FFF6D0 38%,
                                    #E0A93B 62%, #B97A1E 88%, #E0A93B 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  -webkit-text-fill-color: transparent;
}
#headline.hc-top .hl-line   { color: var(--hgold); -webkit-text-fill-color: var(--hgold); }
#headline.hc-top .hl-line-1 { color: #FFFFFF; -webkit-text-fill-color: #FFFFFF; }
#headline.hc-alt .hl-odd    { color: #FFFFFF; -webkit-text-fill-color: #FFFFFF; }
#headline.hc-alt .hl-even   { color: var(--hgold); -webkit-text-fill-color: var(--hgold); }
#headline.hc-mix .hw-white { color: #FFFFFF; -webkit-text-fill-color: #FFFFFF; }
#headline.hc-mix .hw-gold  { color: var(--hgold); -webkit-text-fill-color: var(--hgold); }

#render-ready { position: absolute; width: 1px; height: 1px; opacity: 0; }
</style>
</head>
<body>

<!-- Sharpening kernels. A convolve matrix works on the composited element, so
     the background, the cut-outs and the logo can each be sharpened after
     they have been scaled into place - which is where softness actually
     creeps in. preserveAlpha keeps cut-out transparency intact. -->
<svg id="fx" width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="sharp" x="-2%" y="-2%" width="104%" height="104%">
    <feConvolveMatrix order="3" preserveAlpha="true" divisor="1"
      kernelMatrix="0 -0.35 0  -0.35 2.4 -0.35  0 -0.35 0"/>
  </filter>
  <filter id="sharpSoft" x="-2%" y="-2%" width="104%" height="104%">
    <feConvolveMatrix order="3" preserveAlpha="true" divisor="1"
      kernelMatrix="0 -0.2 0  -0.2 1.8 -0.2  0 -0.2 0"/>
  </filter>
</svg>

<div id="canvas">
  <img id="bg" alt="">
  <div id="tone"></div>
  <svg id="arrows" viewBox="0 0 1080 1350" preserveAspectRatio="none"></svg>
  <div id="badges"></div>
  <div id="logo" style="display:none"><img alt=""></div>
  <div id="glue"></div>
  <div id="rule"><span class="line"></span><img class="brand" alt=""><span class="line"></span></div>
  <h1 id="headline"></h1>
  <svg id="grain"><filter id="gf"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3"/></filter><rect width="100%" height="100%" filter="url(#gf)"/></svg>
</div>

<script>
(function () {
  'use strict';

  var Q = new URLSearchParams(location.search);
  function p(name, dflt) { var v = Q.get(name); return (v === null || v === '') ? dflt : v; }
  function num(name, dflt) { var v = parseFloat(Q.get(name)); return isNaN(v) ? dflt : v; }

  /* ---- scale -------------------------------------------------------------
     scale=2 renders 2160x2700. Ask the screenshot service for the matching
     viewport and the post comes back with genuinely twice the detail rather
     than an upscale. */
  var scale = Math.max(1, Math.min(4, num('scale', 1)));
  document.documentElement.style.setProperty('--w', (1080 * scale) + 'px');

  var canvas   = document.getElementById('canvas');
  var bgEl     = document.getElementById('bg');
  var ruleEl   = document.getElementById('rule');
  var brandEl  = ruleEl.querySelector('.brand');
  var headEl   = document.getElementById('headline');
  var badgesEl = document.getElementById('badges');
  var logoBox  = document.getElementById('logo');
  var arrowsEl = document.getElementById('arrows');
  var grainEl  = document.getElementById('grain');

  var pending = [];   // images we must wait for before declaring ready

  function loadImg(el, url) {
    if (!url) return;
    pending.push(new Promise(function (done) {
      // Resolve on error too. A single dead photo should degrade the post,
      // never hang the renderer until the screenshot service times out.
      el.addEventListener('load', done, { once: true });
      el.addEventListener('error', function () { el.style.display = 'none'; done(); }, { once: true });
      el.src = url;
    }));
  }

  /* ---- background --------------------------------------------------------- */
  loadImg(bgEl, p('bg', ''));
  bgEl.style.objectPosition = '50% ' + num('bgy', 22) + '%';
  // bgz: zoom the background in, anchored at the bottom-centre. Article
  // photos are often nearly 4:5 already, leaving no room to slide them with
  // bgy, so a gap above the subject's head can only be closed by zooming.
  var BGZ = Math.max(1, Math.min(2, num('bgz', 1)));
  if (BGZ > 1) { bgEl.style.transformOrigin = '50% 100%'; bgEl.style.transform = 'scale(' + BGZ + ')'; }

    bebas:     ["'Bebas Neue', sans-serif", '400'],
    // --- wide ----------------------------------------------------------
    archivo:  ["'Archivo Black', sans-serif", '400'],   // heaviest
    archivo8: ["'Archivo', sans-serif", '800'],         // same family, lighter
    archivo7: ["'Archivo', sans-serif", '700'],
    roboto9:  ["'Roboto', sans-serif", '900'],
    roboto:   ["'Roboto', sans-serif", '700'],
    inter8:   ["'Inter', sans-serif", '800'],
    inter:    ["'Inter', sans-serif", '700'],
    oswald:   ["'Oswald', sans-serif", '700'],          // condensed
    system:   ["Helvetica, Arial, sans-serif", '700']
  };
  // League Gothic is the house face: tall, narrow and stacked, matching the
  // reference accounts. The other entries stay available through &hf= so a
  // different face can still be tried on a single post.
  var hf = (p('hf', 'league') || 'league').toLowerCase();
  var pick = FONT_STACKS[hf] || FONT_STACKS.league;

  // Condensed faces fit far more words per line, so starting them at the
  // same size as a wide face leaves a small headline floating in a big band.
  // They start larger and the fitting loop shrinks them to fill the space.
  var CONDENSED = { anton: 1, bigshoul: 1, barlow: 1, saira: 1, league: 1, antonio: 1, bebas: 1 };
  var START_SIZE = CONDENSED[hf] ? 3.6 : 2.45;
  var headlineStack = pick[0];
  headEl.style.fontFamily = headlineStack;
  headEl.style.fontWeight = pick[1];

  /* ---- layout pass --------------------------------------------------------
     The headline is bottom-anchored and shrinks until it fits its band, then
     the rule is placed just above whatever height it settled at. Long
     headlines therefore push the rule up instead of overflowing the frame. */
  // Shared 2D context used only to measure text widths for line balancing.
  var MEASURE = document.createElement('canvas').getContext('2d');

  function layout() {
    var H = canvas.clientHeight;
    var base = canvas.clientWidth / 27;        // 1em in px
    var maxH = H * 0.40;                       // tallest the headline may stand
    var MAXW = 92.8;                           // widest the headline may run, %

    headEl.style.bottom = (H * 0.055) + 'px';
    headEl.style.width = MAXW + '%';

    /* ---- fit the headline to the WIDTH ------------------------------------
       The old approach picked a line count first and then shrank the text to
       fit the height. With a narrow face that produced even lines that never
       reached the edges - big gaps left and right. The reference posts work
       the other way round: the text is sized so the longest line runs nearly
       edge to edge.

       So every sensible line count is tried. For each, the words are split as
       evenly as possible, then the font size is set by whichever runs out
       first: the longest line hitting the full width, or the stack hitting
       the height limit. The line count that yields the LARGEST type wins -
       that is the one that fills the band. Measured on a canvas in the real
       face at a reference size; widths scale linearly with font size. */
    var words = PLAIN.split(' ');
    var avail = headEl.clientWidth;
    var cs = getComputedStyle(headEl);
    var padV = parseFloat(cs.paddingTop || 0) + parseFloat(cs.paddingBottom || 0);
    var LH = 0.88;                              // must match line-height in CSS

    var REF = 100;                              // measure at 100px, then scale
    MEASURE.font = headEl.style.fontWeight + ' ' + REF + 'px ' + headlineStack;
    var n = words.length;
    var W = [];
    for (var a = 0; a < n; a++) {
      W[a] = []; var run = '';
      for (var b = a; b < n; b++) {
        run = run ? (run + ' ' + words[b]) : words[b];
        W[a][b] = MEASURE.measureText(run).width;
      }
    }

    // Split into exactly k lines. The font size is set by the WIDEST line,
    // so that is minimised first; among splits with the same widest line, the
    // most even one wins. Minimising evenness alone put "SNOOKI IS" on a line
    // by itself, which shrank the whole headline to fit one long line below.
    function split(k) {
      var INF = Infinity, mx = [], sq = [], back = [];
      for (var q = 0; q <= k; q++) {
        mx[q] = new Array(n + 1).fill(INF);
        sq[q] = new Array(n + 1).fill(INF);
        back[q] = new Array(n + 1).fill(-1);
      }
      mx[0][0] = 0; sq[0][0] = 0;
      for (var q2 = 1; q2 <= k; q2++) {
        for (var i = 1; i <= n; i++) {
          for (var j = q2 - 1; j < i; j++) {
            if (mx[q2 - 1][j] === INF) continue;
            var w = W[j][i - 1];
            var m = Math.max(mx[q2 - 1][j], w);
            var s = sq[q2 - 1][j] + w * w;
            if (m < mx[q2][i] - 1e-6 || (Math.abs(m - mx[q2][i]) < 1e-6 && s < sq[q2][i])) {
              mx[q2][i] = m; sq[q2][i] = s; back[q2][i] = j;
            }
          }
        }
      }
      if (mx[k][n] === INF) return null;
      var lines = [], widths = [], at = n;
      for (var q3 = k; q3 > 0; q3--) {
        var from = back[q3][at];
        lines.unshift(words.slice(from, at).join(' '));
        widths.unshift(W[from][at - 1]);
        at = from;
      }
      return { lines: lines, widths: widths,
               widest: Math.max.apply(null, widths),
               shortest: Math.min.apply(null, widths) };
    }

    var ENDING_FILLER = { A:1, AN:1, THE:1, TO:1, OF:1, AND:1, OR:1, IN:1, ON:1, AT:1,
                          FOR:1, WITH:1, THAT:1, IS:1, WAS:1, HER:1, HIS:1, IT:1 };
    var best = null;
    var maxLines = Math.min(6, n);
    for (var k = 1; k <= maxLines; k++) {
      var s = split(k);
      if (!s) continue;
      var byWidth  = avail * 0.985 / s.widest * REF;        // px, longest line fills width
      var byHeight = (maxH - padV) / (k * LH);              // px, stack fits the band
      var px = Math.min(byWidth, byHeight);
      // Bigger type wins, but a lopsided stack is penalised - one short line
      // among long ones reads as a mistake even when the type is large.
      var even = s.shortest / s.widest;
      var fill = Math.min(1, (s.widest / REF * px) / avail);
      // Bigger type wins, but a lopsided stack is penalised, and so is a
      // block that stops well short of the edges - a narrow headline
      // floating in the middle of the band reads as small, which is the gap
      // that made the bear and Christian Bale posts look weak.
      var score = px * (0.6 + 0.4 * even) * (0.55 + 0.45 * fill);
      // A line that ends on a filler word ("...OPENED A", "...WITH THE")
      // reads as broken. Each one costs the layout 15%.
      for (var e = 0; e < s.lines.length - 1; e++) {
        var lastWord = s.lines[e].split(' ').pop();
        if (ENDING_FILLER[lastWord]) score *= 0.85;
      }
      if (!best || score > best.score) best = { score: score, px: px, lines: s.lines, widths: s.widths, fill: fill };
    }

    headEl.textContent = '';
    headEl.style.fontSize = best.px + 'px';
    var wordIdx = 0;
    for (var m = 0; m < best.lines.length; m++) {
      if (m) headEl.appendChild(document.createElement('br'));
      // Each line is its own span so a colour scheme can address it.
      var ln = document.createElement('span');
      ln.className = 'hl-line hl-line-' + (m + 1) + (m % 2 ? ' hl-even' : ' hl-odd');
      var lw = best.lines[m].split(' ');
      for (var q = 0; q < lw.length; q++) {
        if (q) ln.appendChild(document.createTextNode(' '));
        var ws = document.createElement('span');
        ws.className = (TOKENS[wordIdx] && TOKENS[wordIdx].gold) ? 'hw hw-gold' : 'hw hw-white';
        ws.textContent = lw[q];
        ln.appendChild(ws);
        wordIdx++;
      }
      headEl.appendChild(ln);
    }

    // A block held back by the height limit can't grow its type, but it can
    // be widened: open the letter-spacing slightly until the longest line
    // nears the edges. Capped at 0.05em - beyond that condensed caps start
    // to look spaced out rather than set tight.
    headEl.style.letterSpacing = '';
    if (best.fill < 0.93) {
      var wi = best.widths.indexOf(Math.max.apply(null, best.widths));
      var chars = best.lines[wi].length;
      var widestPx = best.widths[wi] / REF * best.px;
      var need = avail * 0.97 - widestPx;
      var track = Math.max(0, Math.min(0.05, need / (chars * best.px)));
      if (track > 0.002) headEl.style.letterSpacing = track.toFixed(4) + 'em';
    }

    // Safety net: if real layout disagrees with the measurement by a hair,
    // shave the size until it genuinely fits.
    var guard = 0;
    while ((headEl.scrollHeight > maxH || headEl.scrollWidth > avail + 1) && guard++ < 40) {
      best.px *= 0.985;
      headEl.style.fontSize = best.px + 'px';
    }

    /* Seat the last line's BASELINE a fixed distance above the bottom edge.
       The headline box used to sit 5.5% up, but the visible gap was larger:
       the box has bottom padding, and each line box has empty space below
       the capitals where descenders would go - and all-caps headlines have
       none. So the gap is measured to where the letters actually end. */
    try {
      var fsB = parseFloat(getComputedStyle(headEl).fontSize);
      var padB = parseFloat(getComputedStyle(headEl).paddingBottom || 0);
      MEASURE.font = headEl.style.fontWeight + ' ' + fsB + 'px ' + headlineStack;
      var mB = MEASURE.measureText('H');
      var aB = mB.fontBoundingBoxAscent, dB = mB.fontBoundingBoxDescent;
      if (aB) {
        var lbB = fsB * LH;
        var baseB = (lbB - (aB + dB)) / 2 + aB;   // baseline, from line-box top
        var belowBaseline = lbB - baseB;          // empty space under the caps
        var BOTTOM_GAP = H * 0.032;               // visible margin under the text
        headEl.style.bottom = (BOTTOM_GAP - padB - belowBaseline) + 'px';
      }
    } catch (e) { /* metrics unavailable - keep the default offset */ }

    var top = headEl.getBoundingClientRect().top - canvas.getBoundingClientRect().top;

    /* Sit the rule and logo just above the tops of the CAPITALS, not above
       the headline's box. The box has padding at the top (so tall caps
       aren't clipped) and extra line spacing, so a gap measured from the box
       edge came out far larger on screen than the number suggested.

       Where the caps start is worked out from the font's own metrics: the
       browser centres the font's ascent-plus-descent inside each line box,
       so the baseline and cap height give the exact top of the letters. */
    var ruleH = ruleEl.offsetHeight || base;
    var fsPx = parseFloat(getComputedStyle(headEl).fontSize);
    var padTop = parseFloat(getComputedStyle(headEl).paddingTop || 0);
    var capTop = top + padTop;                       // fallback: top of line box
    try {
      MEASURE.font = headEl.style.fontWeight + ' ' + fsPx + 'px ' + headlineStack;
      var mH = MEASURE.measureText('H');
      var asc = mH.fontBoundingBoxAscent, desc = mH.fontBoundingBoxDescent;
      var capAsc = mH.actualBoundingBoxAscent;
      if (asc && capAsc) {
        var lineBox = fsPx * LH;
        var baseline = (lineBox - (asc + desc)) / 2 + asc;
        capTop = top + padTop + (baseline - capAsc);
      }
    } catch (e) { /* metrics unavailable - keep the line-box fallback */ }

    var GAP = base * 0.22;                           // small, deliberate breathing room
    var ruleTop = Math.max(H * 0.36, capTop - GAP - ruleH);
    ruleEl.style.top = ruleTop + 'px';

    /* Start the fade just below the top of the headline text, then ramp to
       solid quickly. fadeoff shifts the start in ems if a particular photo
       wants more or less cover. */
    var toneEl = document.getElementById('tone');
    if (toneEl) {
      var fadeStart = ruleTop + ruleH * 0.5 + (num('fadeoff', 0) * fsPx);
      var ramp = fsPx * 0.75;
      var pct = function (px) { return (px / H * 100).toFixed(2) + '%'; };
      toneEl.style.background =
        'radial-gradient(120% 80% at 50% 18%, rgba(0,0,0,0) 38%, rgba(0,0,0,.30) 100%),' +
        'linear-gradient(to bottom,' +
        ' rgba(0,0,0,.18) 0%,' +
        ' rgba(0,0,0,.06) ' + pct(Math.max(0, fadeStart - ramp * 1.6)) + ',' +
        ' rgba(0,0,0,.00) ' + pct(Math.max(0, fadeStart - ramp * 0.5)) + ',' +
        ' rgba(0,0,0,.55) ' + pct(fadeStart + ramp * 0.45) + ',' +
        ' rgba(0,0,0,.88) ' + pct(fadeStart + ramp * 1.1) + ',' +
        ' rgba(0,0,0,.97) ' + pct(fadeStart + ramp * 1.8) + ',' +
        ' #000 100%)';
    }

    // Grain is clipped to the headline box so it textures the letters and
    // leaves the photograph alone.
    var r = headEl.getBoundingClientRect();
    var c = canvas.getBoundingClientRect();
    grainEl.setAttribute('width',  r.width);
    grainEl.setAttribute('height', r.height);
    grainEl.style.left = (r.left - c.left) + 'px';
    grainEl.style.top  = (r.top  - c.top)  + 'px';
  }

  /* ---- preview fit --------------------------------------------------------
     At scale=2 the canvas is 2160x2700 CSS pixels, so opening the URL in a
     browser shows only its top-left corner. This shrinks the page to fit the
     window so the whole post is visible.

     It keys off WIDTH ONLY, and only ever shrinks. Every screenshot service
     sets its viewport width to exactly the width we asked for, so for them
     the scale works out to 1 and the capture is untouched. Height is
     deliberately ignored: at least one fallback renderer uses a short
     viewport and crops, and scaling on height would silently shrink the real
     post. */
  function fitPreview() {
    var cw = canvas.offsetWidth;
    if (!cw) return;
    var s = Math.min(1, window.innerWidth / cw);
    document.body.style.transformOrigin = 'top center';
    document.body.style.transform = (s < 0.999) ? ('scale(' + s + ')') : '';
  }
  window.addEventListener('resize', fitPreview);

  /* ---- ready sentinel -----------------------------------------------------
     #render-ready is what the screenshot service waits for. It must appear
     only after fonts AND images have settled, or the capture catches a
     half-painted canvas. */
  function ready() {
    var s = document.createElement('div');
    s.id = 'render-ready';
    document.body.appendChild(s);
  }

  var fonts = (document.fonts && document.fonts.ready) ? document.fonts.ready : Promise.resolve();

  /* Web fonts load LAZILY - the browser only fetches a face once it lays out
     text that needs it. document.fonts.ready therefore resolves instantly
     when checked before layout, because nothing is pending yet, and the
     screenshot catches the fallback font. A browser tab never shows the
     problem because the real face swaps in a moment later; a screenshot
     taken the instant the page says "ready" does.

     So request the headline face explicitly, at its real weight, and wait for
     it. load() resolves with the matching faces once they are usable. */
  var headlineFamily = headlineStack.split(',')[0].trim();
  var headlineFont = (document.fonts && document.fonts.load)
    ? document.fonts.load(pick[1] + ' 100px ' + headlineFamily, 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789')
        .catch(function () { /* fall back rather than hang */ })
    : Promise.resolve();

  // Hard ceiling: if something never settles, render anyway rather than let
  // the screenshot call burn its full timeout and fail the whole batch.
  var ceiling = new Promise(function (r) { setTimeout(r, 9000); });

  Promise.race([Promise.all(pending.concat([headlineFont, fonts])), ceiling]).then(function () {
    layout();
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        layout();
        fitPreview();
        ready();
      });
    });
  });
})();
</script>
</body>
</html>
