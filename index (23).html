<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Not Common Facts — Post Generator</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Anton&family=Archivo+Black&family=Inter:wght@600;700;800&display=swap');

/* ===========================================================================
   FONT — PASTE YOUR EXISTING DRUK SRC HERE

   Open the OLD index.html, find the line that begins:

       src: url(data:font/otf;base64,T1RUTwALAIAAAw...

   Copy that entire line (it is one very long line) and paste it over the
   src: line below, replacing it. Everything else in this file is new.

   If the paste is skipped, headlines fall back to Anton — close in spirit,
   noticeably wider, and not the brand face.
   =========================================================================== */
@font-face {
  font-family: 'Druk Condensed Super';
  src: url(druk-condensed-super.otf) format('opentype');
  font-display: block;
}

:root {
  /* Every dimension in this file is expressed in em, and 1em is derived from
     the canvas width. That is what makes the whole design resolution
     independent: render at 1080 for a proof, 2160 for the real post, and the
     layout is identical, just with twice the pixels in the type and photos. */
  --w: 1080px;

  --gold-1: #FFF6D0;
  --gold-2: #F7D774;
  --gold-3: #E0A93B;
  --gold-4: #B97A1E;
  --rule:   #D9A93E;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  background: #101010;
  display: flex;
  align-items: flex-start;
  justify-content: center;
}

#canvas {
  position: relative;
  width: var(--w);
  height: calc(var(--w) * 1.25);   /* 4:5 — 1080x1350 at scale 1 */
  font-size: calc(var(--w) / 27);  /* the em basis */
  overflow: hidden;
  background: #000;
  font-family: 'Inter', system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
}

/* ---------- background ---------------------------------------------------- */

#bg {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  object-fit: cover;
  object-position: 50% 32%;   /* top-biased: keeps faces out of the text band */
}

/* A cool dark wash over the whole frame, so gold type always has something to
   sit against even when the photo underneath is bright and busy. */
#tone {
  position: absolute; inset: 0;
  background:
    radial-gradient(120% 80% at 50% 18%, rgba(0,0,0,0) 38%, rgba(0,0,0,.42) 100%),
    linear-gradient(to bottom,
      rgba(0,0,0,.30) 0%,
      rgba(0,0,0,.10) 26%,
      rgba(0,0,0,.00) 42%,
      rgba(0,0,0,.55) 58%,
      rgba(0,0,0,.88) 72%,
      rgba(0,0,0,.97) 84%,
      #000 100%);
}

/* ---------- badges (the circle with the pop-out) -------------------------- */

.badge { position: absolute; }

.badge .disc {
  position: absolute; inset: 0;
  border-radius: 50%;
  overflow: hidden;
  background: #1b1b1b;
}
.badge .disc img {
  width: 100%; height: 100%;
  object-fit: cover;
  object-position: 50% 28%;
}

/* The ring sits ABOVE the disc but BELOW the cut-out, which is the whole
   trick: the subject's head crosses in front of the ring and the badge stops
   looking like a sticker. */
.badge .ring {
  position: absolute; inset: 0;
  border-radius: 50%;
  border: .085em solid rgba(255,255,255,.92);
  box-shadow: 0 .10em .34em rgba(0,0,0,.55);
  z-index: 2;
}

.badge .cut {
  position: absolute;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  z-index: 3;
  filter: drop-shadow(0 .10em .26em rgba(0,0,0,.55));
  pointer-events: none;
}

/* Without a real cut-out there is nothing to break the circle, so the badge
   renders as a plain framed portrait rather than a broken-looking disc. */
.badge.flat .ring { border-color: rgba(255,255,255,.86); }

/* ---------- logo layer ---------------------------------------------------- */

#logo {
  position: absolute;
  z-index: 4;
  filter: drop-shadow(0 .10em .30em rgba(0,0,0,.6));
}
#logo img { width: 100%; height: auto; display: block; }

/* ---------- arrows -------------------------------------------------------- */

#arrows { position: absolute; inset: 0; z-index: 3; pointer-events: none; }

/* ---------- rule + wordmark ---------------------------------------------- */

#rule {
  position: absolute;
  left: 3.6%;
  right: 3.6%;
  z-index: 5;
  display: flex;
  align-items: center;
  gap: .5em;
}
#rule .line { flex: 1; height: .045em; background: var(--rule); opacity: .95; }
#rule .mark {
  font-family: 'Archivo Black', system-ui, sans-serif;
  font-size: .62em;
  letter-spacing: .01em;
  color: var(--rule);
  white-space: nowrap;
}

/* ---------- headline ------------------------------------------------------ */

#headline {
  position: absolute;
  left: 3.6%;
  right: 3.6%;
  z-index: 5;
  font-family: 'Druk Condensed Super', 'Anton', 'Archivo Black', sans-serif;
  text-transform: uppercase;
  line-height: .875;
  letter-spacing: -.004em;
  font-size: 2.4em;              /* starting size; JS fits it from here down */

  /* The gold is a gradient rather than a flat fill, with a brighter band
     across the upper third — that is what reads as metallic rather than
     yellow. */
  background-image: linear-gradient(
      177deg,
      var(--gold-1) 0%,
      var(--gold-2) 22%,
      var(--gold-1) 38%,
      var(--gold-3) 62%,
      var(--gold-4) 88%,
      var(--gold-3) 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  -webkit-text-fill-color: transparent;
  filter: drop-shadow(0 .035em .05em rgba(0,0,0,.85));
}

/* A faint grain laid over the letters only. Real foil has tooth; a perfectly
   smooth gradient is the thing that makes a gold headline look synthetic. */
#grain {
  position: absolute;
  z-index: 6;
  pointer-events: none;
  mix-blend-mode: overlay;
  opacity: .30;
}

#render-ready { position: absolute; width: 1px; height: 1px; opacity: 0; }
</style>
</head>
<body>

<div id="canvas">
  <img id="bg" alt="">
  <div id="tone"></div>
  <svg id="arrows" viewBox="0 0 1080 1350" preserveAspectRatio="none"></svg>
  <div id="badges"></div>
  <div id="logo" style="display:none"><img alt=""></div>
  <div id="rule"><span class="line"></span><span class="mark"></span><span class="line"></span></div>
  <h1 id="headline"></h1>
  <svg id="grain"><filter id="gf"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3"/></filter><rect width="100%" height="100%" filter="url(#gf)"/></svg>
</div>

<script>
(function () {
  'use strict';

  var Q = new URLSearchParams(location.search);
  function p(name, dflt) { var v = Q.get(name); return (v === null || v === '') ? dflt : v; }
  function num(name, dflt) { var v = parseFloat(Q.get(name)); return isNaN(v) ? dflt : v; }

  /* ---- scale -------------------------------------------------------------
     scale=2 renders 2160x2700. Ask the screenshot service for the matching
     viewport and the post comes back with genuinely twice the detail rather
     than an upscale. */
  var scale = Math.max(1, Math.min(4, num('scale', 1)));
  document.documentElement.style.setProperty('--w', (1080 * scale) + 'px');

  var canvas   = document.getElementById('canvas');
  var bgEl     = document.getElementById('bg');
  var ruleEl   = document.getElementById('rule');
  var markEl   = ruleEl.querySelector('.mark');
  var headEl   = document.getElementById('headline');
  var badgesEl = document.getElementById('badges');
  var logoBox  = document.getElementById('logo');
  var arrowsEl = document.getElementById('arrows');
  var grainEl  = document.getElementById('grain');

  var pending = [];   // images we must wait for before declaring ready

  function loadImg(el, url) {
    if (!url) return;
    pending.push(new Promise(function (done) {
      // Resolve on error too. A single dead photo should degrade the post,
      // never hang the renderer until the screenshot service times out.
      el.addEventListener('load', done, { once: true });
      el.addEventListener('error', function () { el.style.display = 'none'; done(); }, { once: true });
      el.src = url;
    }));
  }

  /* ---- background --------------------------------------------------------- */
  loadImg(bgEl, p('bg', ''));
  bgEl.style.objectPosition = '50% ' + num('bgy', 32) + '%';

  /* ---- rule + wordmark ---------------------------------------------------- */
  markEl.textContent = p('mark', 'NOT COMMON FACTS');
  if (p('rule', 'on') === 'off') ruleEl.style.display = 'none';

  /* ---- badges -------------------------------------------------------------
     Slots are the four corners plus bottom-centre, matching how the reference
     accounts lay these out. Each badge takes a photo for the disc and,
     optionally, a transparent cut-out that pops out of the top. */
  var SLOTS = {
    tl: { left: '4%',  top: '5%'   },
    tr: { right: '4%', top: '5%'   },
    bl: { left: '4%',  top: '42%'  },
    br: { right: '4%', top: '42%'  },
    c:  { left: '50%', top: '38%', translate: true }
  };

  function addBadge(photo, cutout, slot, size) {
    if (!photo && !cutout) return;
    var pos = SLOTS[slot] || SLOTS.tl;

    var d = document.createElement('div');
    d.className = 'badge' + (cutout ? '' : ' flat');
    d.style.width  = size + 'em';
    d.style.height = size + 'em';
    if (pos.left)  d.style.left  = pos.left;
    if (pos.right) d.style.right = pos.right;
    d.style.top = pos.top;
    if (pos.translate) d.style.transform = 'translateX(-50%)';

    var disc = document.createElement('div');
    disc.className = 'disc';
    var dImg = document.createElement('img');
    disc.appendChild(dImg);
    d.appendChild(disc);
    loadImg(dImg, photo || cutout);

    var ring = document.createElement('div');
    ring.className = 'ring';
    d.appendChild(ring);

    if (cutout) {
      var c = document.createElement('img');
      c.className = 'cut';
      // popw is the cut-out's width as a fraction of the badge; lift is how
      // far above the circle's top edge the subject rises.
      c.style.width  = (num('popw', 0.82) * 100) + '%';
      c.style.bottom = (num('lift', 0.30) * 100) + '%';
      d.appendChild(c);
      loadImg(c, cutout);
    }

    badgesEl.appendChild(d);
    return d;
  }

  var badgeSize = num('badgesize', 7.6);   // in em ≈ 30% of canvas width

  // Slot 1 keeps the old parameter names, so existing links still render.
  addBadge(p('person', ''),  p('cutout', ''),  p('slot',  'tr'), badgeSize);
  addBadge(p('person2', ''), p('cutout2', ''), p('slot2', 'tl'), num('badgesize2', badgeSize));
  addBadge(p('person3', ''), p('cutout3', ''), p('slot3', 'c'),  num('badgesize3', badgeSize * 0.92));

  /* ---- logo --------------------------------------------------------------- */
  var logoUrl = p('logo', '');
  if (logoUrl) {
    var lp = p('logopos', 'tl');
    logoBox.style.display = 'block';
    logoBox.style.width = (num('logow', 0.26) * 100) + '%';
    if (lp === 'tl') { logoBox.style.left = '5%';  logoBox.style.top = '6%'; }
    if (lp === 'tr') { logoBox.style.right = '5%'; logoBox.style.top = '6%'; }
    if (lp === 'bl') { logoBox.style.left = '5%';  logoBox.style.top = '46%'; }
    if (lp === 'br') { logoBox.style.right = '5%'; logoBox.style.top = '46%'; }
    loadImg(logoBox.querySelector('img'), logoUrl);
  }

  /* ---- arrows -------------------------------------------------------------
     arrows=tl,br draws a curved gold arrow from that corner toward the middle
     of the frame — the device the reference posts use to tie a face to the
     thing it is about. */
  var arrowSpec = p('arrows', '');
  if (arrowSpec) {
    var FROM = {
      tl: [250, 430, 470, 690], tr: [830, 430, 610, 690],
      bl: [250, 900, 470, 760], br: [830, 900, 610, 760]
    };
    var svg = '<defs><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" ' +
              'markerWidth="5" markerHeight="5" orient="auto-start-reverse">' +
              '<path d="M0,0 L10,5 L0,10 z" fill="#F5C33B"/></marker></defs>';
    arrowSpec.split(',').forEach(function (k) {
      var a = FROM[k.trim()];
      if (!a) return;
      var cx = (a[0] + a[2]) / 2 + (a[0] < 540 ? 90 : -90);
      var cy = (a[1] + a[3]) / 2 - 70;
      svg += '<path d="M' + a[0] + ',' + a[1] + ' Q' + cx + ',' + cy + ' ' + a[2] + ',' + a[3] + '" ' +
             'fill="none" stroke="#F5C33B" stroke-width="13" stroke-linecap="round" ' +
             'marker-end="url(#ah)" opacity="0.95"/>';
    });
    arrowsEl.innerHTML = svg;
  }

  /* ---- headline ----------------------------------------------------------- */
  var text = p('headline', '');
  if (p('hl', 'on') === 'off') {
    headEl.style.display = 'none';
    ruleEl.style.display = 'none';
  }
  headEl.textContent = text.toUpperCase();

  /* ---- layout pass --------------------------------------------------------
     The headline is bottom-anchored and shrinks until it fits its band, then
     the rule is placed just above whatever height it settled at. Long
     headlines therefore push the rule up instead of overflowing the frame. */
  function layout() {
    var H = canvas.clientHeight;
    var base = canvas.clientWidth / 27;        // 1em in px
    var maxH = H * 0.335;
    var size = 2.45;

    headEl.style.bottom = (H * 0.055) + 'px';
    headEl.style.fontSize = size + 'em';

    var guard = 0;
    while (headEl.scrollHeight > maxH && size > 1.15 && guard++ < 60) {
      size -= 0.045;
      headEl.style.fontSize = size + 'em';
    }

    var top = headEl.getBoundingClientRect().top - canvas.getBoundingClientRect().top;
    ruleEl.style.top = Math.max(H * 0.40, top - base * 1.15) + 'px';

    // Grain is clipped to the headline box so it textures the letters and
    // leaves the photograph alone.
    var r = headEl.getBoundingClientRect();
    var c = canvas.getBoundingClientRect();
    grainEl.setAttribute('width',  r.width);
    grainEl.setAttribute('height', r.height);
    grainEl.style.left = (r.left - c.left) + 'px';
    grainEl.style.top  = (r.top  - c.top)  + 'px';
  }

  /* ---- preview fit --------------------------------------------------------
     At scale=2 the canvas is 2160x2700 CSS pixels, so opening the URL in a
     browser shows only its top-left corner. This shrinks the page to fit the
     window so the whole post is visible.

     It keys off WIDTH ONLY, and only ever shrinks. Every screenshot service
     sets its viewport width to exactly the width we asked for, so for them
     the scale works out to 1 and the capture is untouched. Height is
     deliberately ignored: at least one fallback renderer uses a short
     viewport and crops, and scaling on height would silently shrink the real
     post. */
  function fitPreview() {
    var cw = canvas.offsetWidth;
    if (!cw) return;
    var s = Math.min(1, window.innerWidth / cw);
    document.body.style.transformOrigin = 'top center';
    document.body.style.transform = (s < 0.999) ? ('scale(' + s + ')') : '';
  }
  window.addEventListener('resize', fitPreview);

  /* ---- ready sentinel -----------------------------------------------------
     #render-ready is what the screenshot service waits for. It must appear
     only after fonts AND images have settled, or the capture catches a
     half-painted canvas. */
  function ready() {
    var s = document.createElement('div');
    s.id = 'render-ready';
    document.body.appendChild(s);
  }

  var fonts = (document.fonts && document.fonts.ready) ? document.fonts.ready : Promise.resolve();

  // Hard ceiling: if something never settles, render anyway rather than let
  // the screenshot call burn its full timeout and fail the whole batch.
  var ceiling = new Promise(function (r) { setTimeout(r, 9000); });

  Promise.race([Promise.all(pending.concat([fonts])), ceiling]).then(function () {
    layout();
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        layout();
        fitPreview();
        ready();
      });
    });
  });
})();
</script>
</body>
</html>
